# pnpm settings for a Full Stack Cloudflare project (docs/TECH_STACK.md section 5).
# A multi-package repo also lists its workspaces here (docs/TECH_STACK.md module 8.5):
# packages:
#   - packages/*
#   - apps/*

# Vite+ replaces Vite with its own core build.
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@latest

# pnpm runs dependency install scripts only when listed here (docs/TECH_STACK.md trap 9.16).
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  better-sqlite3: false

# The vite override above is intended, so do not warn about the peer version.
peerDependencyRules:
  allowedVersions:
    vite: "*"
